{% macro pill(level) %}<span class="pill {{ level|level_class }}">{{ level|level_class }}</span>{% endmacro %}

{# A bar drawn as SVG, because the content-security policy forbids style="width: ..." #}
{% macro bar(score, level) %}<svg class="bar" viewBox="0 0 100 7" role="img" aria-label="Score {{ score|int }} of 100"><rect class="track" width="100" height="7" rx="3.5"/><rect class="fill {{ level|level_class }}" width="{{ [score|int, 100]|min }}" height="7" rx="3.5"/></svg>{% endmacro %}

{% macro ring(score, level) %}<svg class="ringscore" viewBox="0 0 36 36" role="img" aria-label="Score {{ score|int }} of 100"><circle class="track" cx="18" cy="18" r="15.9155"/><circle class="ring {{ level|level_class }}" cx="18" cy="18" r="15.9155" stroke-dasharray="{{ [score|int, 100]|min }} 100" stroke-dashoffset="25"/><text x="18" y="21.400">{{ score|int }}</text></svg>{% endmacro %}

{% macro icon(name) %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% if name == 'shield' %}<path d="M12 3l7 3v5c0 5-3.200 8.500-7 10-3.800-1.500-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>{% elif name == 'list' %}<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>{% elif name == 'share' %}<circle cx="6" cy="12" r="2.500"/><circle cx="18" cy="6" r="2.500"/><circle cx="18" cy="18" r="2.500"/><path d="M8.200 10.900l7.600-3.800M8.200 13.100l7.600 3.800"/>{% elif name == 'code' %}<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>{% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.300-4.300"/>{% elif name == 'alert' %}<path d="M10.300 3.900L1.800 18a2 2 0 0 0 1.700 3h17a2 2 0 0 0 1.700-3L13.700 3.900a2 2 0 0 0-3.400 0zM12 9v4M12 17h.01"/>{% elif name == 'box' %}<path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3.300 7.500L12 12.500l8.700-5M12 22V12.500"/>{% elif name == 'target' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>{% endif %}</svg>{% endmacro %}
