[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgsentry"
version = "0.1.0"
description = "Detect malicious Python packages on PyPI without installing them."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
dev = ["pytest>=8", "httpx2>=2", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]

[project.scripts]
pkgsentry = "pkgsentry.cli:main"

[tool.setuptools.packages.find]
include = ["pkgsentry*"]

# Ship the popular-packages snapshot and the dashboard's pages inside the built package.
[tool.setuptools.package-data]
pkgsentry = ["data/*.json", "web/templates/*.html", "web/static/*"]

# Never let pytest import code from downloaded packages.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["downloads", "samples", "guide", ".*", "venv", "build", "dist", "*.egg-info"]
