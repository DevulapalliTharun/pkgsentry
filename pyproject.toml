[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgsentry"
version = "0.1.0"
description = "Detect malicious Python packages on PyPI without installing them."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pkgsentry = "pkgsentry.cli:main"

[tool.setuptools.packages.find]
include = ["pkgsentry*"]

# Never let pytest import code from downloaded packages.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["downloads", "samples", "guide", ".*", "venv", "build", "dist", "*.egg-info"]
